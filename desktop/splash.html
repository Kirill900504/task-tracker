<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Планировщик задач</title>
    <style>
      /* Заставка на те доли секунды, пока грузится сайт.
         Файл лежит рядом с приложением, поэтому рисуется мгновенно — в
         отличие от страницы трекера, которой нужна сеть. Ровно тот же фон
         (--paper в tracker.css) и системный шрифт: собственные шрифты
         тянуть неоткуда и незачем. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #232b2e;
        color: #e8edef;
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 20px;
      }
      .title {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .sub {
        font-size: 13px;
        color: #a9b6bb;
      }
      /* Тонкая полоса вместо крутящегося колеса: она говорит «идёт», не
         привлекая к себе внимания, и не намекает на проценты, которых мы
         не знаем. */
      .bar {
        width: 180px;
        height: 3px;
        border-radius: 999px;
        background: #2f3a3e;
        overflow: hidden;
      }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #3e8aa8;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar span { animation: none; width: 100%; opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="build/icon.png" alt="" />
      <div class="title">Планировщик задач</div>
      <div class="sub">Открываю трекер…</div>
      <div class="bar"><span></span></div>
    </div>
  </body>
</html>
