name: Desktop app

# Builds the Windows installer and publishes it as a GitHub release, which is
# also where the installed app looks for its own updates (electron-updater
# reads the latest release of this repository — it is public, so no token
# travels with the app).
#
# It runs on a tag, not on every push, for two reasons: the wrapper changes a
# few times a year while the tracker changes daily, and every run here costs a
# 90 MB upload. Release like this:
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# The tag has to match the version in desktop/package.json, or electron-builder
# publishes into a release nobody is looking at.
#
# GitHub-hosted runners are used deliberately: building here needs no Rust, no
# Visual Studio and nothing installed on anybody's machine — the whole point of
# choosing Electron over Tauri for this project.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      # electron-builder creates the release and uploads the installer to it.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # npm ci, not install: the lockfile is what makes a release reproducible,
      # and desktop/ has its own, separate from the site's.
      - run: npm ci
        working-directory: desktop

      # Electron's binary (~100 MB) arrives through a postinstall script, and
      # npm 11 does not run install scripts unless they are approved — the
      # approval lives in package.json and is pinned to an exact version, so
      # a lockfile refresh silently leaves the binary undownloaded. `npm ci`
      # finishing in twelve seconds is what that looks like, and the failure
      # surfaces much later, inside electron-builder. Running the installer
      # ourselves costs nothing when the binary is already there.
      - run: node node_modules/electron/install.js
        working-directory: desktop

      # The build's own error has to reach somebody who cannot read the logs.
      # Action logs need admin rights on this repository, so the last lines of
      # stderr are echoed as an annotation, which the API serves publicly —
      # the same trick ci.yml uses for the schema test.
      - name: Build the installer
        working-directory: desktop
        shell: bash
        run: |
          set -o pipefail
          npm run dist 2>&1 | tee build.log || {
            echo "::error::$(tail -n 12 build.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          }

      # Релиз публикует ОТДЕЛЬНЫЙ шаг, а не сам electron-builder.
      #
      # Он грузит установщик и его .blockmap двумя разными обращениями: ни
      # одно не находит готового релиза, и оба его создают — на тег выходит
      # ДВА релиза. Опаснее всего то, как это выглядит: сборка зелёная,
      # установщик есть, а «последним» GitHub показывает тот релиз, где
      # лежит один .blockmap — без .exe и без latest.yml. Постоянная ссылка
      # ведёт в пустоту, установленное приложение обновления не находит и
      # молчит об этом. Так прошли 1.0.1, 1.0.2 и 1.0.3.
      #
      # Отключить .blockmap нельзя: вместе с ним из latest.yml пропадает
      # size, а без size electron-updater качать отказывается — на этом
      # сгорела 1.0.4. Поэтому файлы уходят одной командой: релиз создаётся
      # один раз и сразу со всем содержимым.
      - name: Publish the release
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          ls -la dist
          gh release create "$TAG" dist/*.exe dist/*.exe.blockmap dist/latest.yml \
            --title "${TAG#v}" --notes "Планировщик задач ${TAG#v}" 2>&1 | tee publish.log || {
            echo "::error::$(tail -n 12 publish.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          }
          # Выпуск проверяется не зелёной галочкой, а списком файлов: без
          # latest.yml обновление не найдёт никто — ни человек по ссылке,
          # ни установленное приложение.
          have=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(" ")')
          echo "в релизе: $have"
          case "$have" in *latest.yml*) ;; *) echo "::error::latest.yml не попал в релиз — обновление не найдётся"; exit 1 ;; esac
          case "$have" in *.exe*) ;; *) echo "::error::установщик не попал в релиз"; exit 1 ;; esac
