name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # These two are NEXT_PUBLIC_* values — already shipped in the deployed
    # site's browser bundle (the anon key is meant to be public; real access
    # control is Supabase RLS), so there's nothing gained by hiding them
    # behind GitHub Secrets. Only needed here so `next build` has something
    # to inline; they're not used to reach any real backend during CI.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://mglynwkucpcbkdeuymoa.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nbHlud2t1Y3BjYmtkZXV5bW9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyODc0ODEsImV4cCI6MjEwMzg2MzQ4MX0.KxRDP5VAVeZWZRjaVKPIo5gdFQ8ppjOvaBDJOAaDMMQ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx eslint src --max-warnings=0
      - run: npx vitest run
      # `next build` runs its own TypeScript check internally — and it has
      # to run before any standalone `tsc`, since it's also what generates
      # the `.next/types` ambient types (e.g. LayoutProps) that layout.tsx
      # depends on. A separate `tsc --noEmit` first (tried in run #1) fails
      # for exactly that reason.
      - run: npm run build
      # Единственная проверка правил доступа многопользовательской части — и
      # ровно та, которая не запускается на машине владельца: она требует
      # postgres рядом, а там Windows. Здесь он есть из коробки, так что
      # проверка идёт на каждый push, а не когда о ней вспомнят. Ничего
      # боевого не трогает: миграции накатываются на пустую временную базу.
      #
      # Падение выносится в аннотацию: логи задания видны только тому, кто
      # вошёл в GitHub, а «Process completed with exit code 1» не говорит
      # ничего и тому, кто вошёл.
      - name: Права доступа на чистой копии схемы (test:schema)
        run: |
          set -o pipefail
          npm run test:schema 2>&1 | tee schema.log || {
            echo "::error::test:schema упал. Последние строки: $(tail -c 2500 schema.log | tr '\n' '¶')"
            exit 1
          }
