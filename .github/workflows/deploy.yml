name: Deploy

# Every push to main goes to the tracker's own server (tracker.rokass.ru),
# the way it used to go to Vercel. See deploy/setup.sh for why the tracker
# left Vercel on 01.11.2026.
#
# The build happens HERE, not on the server: `next build` wants more memory
# than the server's 2 GB, and a build that fails on a GitHub machine leaves
# the running tracker untouched. Only .next/standalone travels — and it
# travels by the server fetching it, see "Publish for the server".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BUILD_STANDALONE: "1"
      # The server is in Moscow, where api.telegram.org does not answer:
      # the tracker runs with MAX only (lib/botTransport TELEGRAM_ENABLED).
      NEXT_PUBLIC_TELEGRAM_ENABLED: "0"
      # Public values — the same ones ci.yml carries, and already in every
      # browser that opens the site.
      NEXT_PUBLIC_SUPABASE_URL: https://mglynwkucpcbkdeuymoa.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nbHlud2t1Y3BjYmtkZXV5bW9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyODc0ODEsImV4cCI6MjEwMzg2MzQ4MX0.KxRDP5VAVeZWZRjaVKPIo5gdFQ8ppjOvaBDJOAaDMMQ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # A standalone build leaves static files and public/ out on purpose
      # (a CDN is expected to serve them); here the same server does.
      - name: Pack
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          tar -czf build.tgz -C .next/standalone .
      # The server PULLS the build (deploy/pull.sh, once a minute) from a
      # pre-release named server-build, so nothing here needs a key to the
      # server and no secret lives in the repository. The repository is
      # public, so the build is no more public than the code it is made of.
      # A PRE-release on purpose: /releases/latest — which the desktop
      # updater and /api/download read — never returns one. build.sha goes
      # up last: it is the signal that build.tgz is complete.
      - name: Publish for the server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${GITHUB_SHA::7}" > build.sha
          gh release view server-build >/dev/null 2>&1 || gh release create server-build --prerelease --target "$GITHUB_SHA" --title "Сборка для сервера" --notes "Последняя сборка main для tracker.rokass.ru. Сервер забирает её сам (deploy/pull.sh); не удалять."
          gh release upload server-build build.tgz --clobber
          gh release upload server-build build.sha --clobber
      # Logs of a run are visible only to repository admins; an annotation
      # is public, so whoever waits for the deploy can see why it failed.
      - name: Explain a failure
        if: failure()
        run: echo "::error::Сборка для сервера не прошла — трекер остался на прежней. Смотрите шаг, отмеченный красным."
